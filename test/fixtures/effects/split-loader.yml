id: "split-loader"
name: "Split Loader"
category: "Presets"
template: "fade-black"
enabled: true
weight: 1
priority: 0
timing:
  fade-in-ticks: 10
  minimum-ticks: 24
  maximum-ticks: 24
  fade-out-ticks: 12
captions:
  enabled: true
  title: "READY WHEN YOU ARE"
  subtitle: "Jump into something new"
  join-detail: ""
  teleport-detail: ""
  preview-detail: ""
  title-color: "#FFE0AF"
  title-font-size: 120
  title-box-width: 0
  title-box-height: 0
  title-align-x: "center"
  title-align-y: "middle"
  title-padding: 2
  title-shadow: false
  title-shadow-color: "#151018"
  title-shadow-offset: 1
  title-outline-width: 0
  title-outline-color: "#251014"
  title-background: "#081221"
  title-background-opacity: 0
  subtitle-color: "#C1D8ED"
  subtitle-font-size: 125
  subtitle-box-width: 0
  subtitle-box-height: 0
  subtitle-align-x: "center"
  subtitle-align-y: "middle"
  subtitle-padding: 2
  subtitle-shadow: false
  subtitle-shadow-color: "#151018"
  subtitle-shadow-offset: 1
  subtitle-outline-width: 0
  subtitle-outline-color: "#251014"
  subtitle-background: "#081221"
  subtitle-background-opacity: 0
presentation:
  show-hands: false
  hide-hud: true
  block-movement: true
  block-interactions: true
appearance:
  palette: "custom"
  background: "#121A29"
  primary: "#EDAA75"
  secondary: "#E2D4C5"
  speed: 1.0
  intensity: 1.0
elements:
  background: "split"
  text-animation: "grow"
  text-y: 0.4
  progress: "bar"
  progress-y: 0.65
  progress-width: 0.3
  text-x: 0.5
  title-offset-x: 0.0
  subtitle-offset-x: 0.0
  title-offset-y: -0.004
  subtitle-offset-y: 0.051
  title-animation: "still"
  subtitle-animation: "slide-up"
  progress-x: 0.5
  progress-scale: 0.7
filters:
  triggers: ["command"]
