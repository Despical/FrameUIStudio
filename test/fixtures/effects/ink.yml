# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#                                                                             #
#                                  Ink Flood                                  #
#                                                                             #
#           https://docs.despical.dev/frameui/configuration/effects/          #
#                                                                             #
#    Customize this design in Studio or edit the settings below. To create    #
#    a copy, use a new filename and matching id.                              #
#                                                                             #
#    IDs use lowercase letters, numbers and single hyphens (up to 48          #
#    characters). Apply changes with /frameui reload.                         #
#                                                                             #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

id: 'ink'
name: 'Ink Flood'
category: "Animations"
# Choose the built-in animation template used by this design.
template: 'ink'
enabled: true
# Automatic selection first uses the highest eligible priority, then random weighted selection.
weight: 1
priority: 0

timing:
  # 20 ticks = 1 second. Fade-in may be 0; each timing is bounded to 1200 ticks.
  fade-in-ticks: 20
  minimum-ticks: 44
  # Wait for world readiness up to this point, then fade out.
  maximum-ticks: 44
  fade-out-ticks: 18

captions:
  enabled: false
  title: 'Ink Flood'
  subtitle: 'Searching the horizon'
  # Placeholders: {player}, {world}, {source-world}, {effect}.
  join-detail: 'Joining the server'
  teleport-detail: 'Travelling to {world}'
  preview-detail: '{effect} preview'

presentation:
  # Showing hands requires hide-hud: false. Hiding the HUD uses a private client view.
  show-hands: false
  hide-hud: true
  block-movement: true
  block-interactions: true

appearance:
  # original preserves this template's palette; custom applies the three colors below.
  palette: 'original'
  background: '#081221'
  primary: '#7FAEFF'
  secondary: '#C2D6FF'
  speed: 1.0 # 0.05..8.0
  intensity: 1.0 # 0.0..4.0
  # Optional PNG in plugins/FrameUI/images/, for example images/logo.png.
  image: ''
  image-fit: 'cover' # cover or contain
  image-opacity: 1.0 # 0.0..1.0

filters:
  # Empty permission allows everyone. Deny permissions always win, including for previews.
  permission: ''
  deny-permissions: []
  # World names support case-insensitive * and ? wildcards. Excludes always win.
  worlds:
    include: [] # Empty means all destination worlds; example: ['lobby', 'survival-*']
    exclude: [] # Example: ['minigame-*']
  source-worlds:
    include: []
    exclude: []
  game-modes:
    include: [] # survival, creative, adventure, spectator; empty means all
    exclude: []
  # Only checked for teleport/world-change requests; use Bukkit teleport cause names.
  teleport-causes: [] # Example: ['command', 'plugin', 'nether-portal']
  # Base events allowed for this effect. Events listed in play-on are always allowed.
  triggers: ['join', 'teleport', 'world-change', 'command']
  # Distance applies only to travel. Cross-world travel has infinite distance.
  distance:
    min: 0
    max: -1 # -1 means unlimited; a finite maximum excludes cross-world travel.
  # Destination Y coordinate.
  height:
    min: -30000000
    max: 30000000
  # Destination world time, inclusive. min > max wraps through midnight.
  time:
    min: 0
    max: 23999
  weather: [] # Empty means all; clear, rain, thunder are separate states.
  # Extra rules for player events listed in play-on. Empty lists and 0 mean no restriction.
  # Each event also accepts worlds.include / worlds.exclude for the world the player is in.
  events:
    first-join:
      worlds:
        include: []
        exclude: []
    respawn:
      worlds:
        include: []
        exclude: []
      reasons: [] # death, end-portal, plugin
      spawn-points: [] # bed, anchor, world
    death:
      worlds:
        include: []
        exclude: []
      causes: [] # Bukkit damage causes, e.g. fall, lava, entity-attack
      sources: [] # player, mob, environment
    bed-enter:
      worlds:
        include: []
        exclude: []
    bed-leave:
      worlds:
        include: []
        exclude: []
      wake: [] # morning, interrupted
    level-up:
      worlds:
        include: []
        exclude: []
      min-level: 0
      max-level: 0 # 0 means no maximum
      every: 0 # 0 plays on every level; 5 plays on levels 5, 10, 15...
    advancement:
      worlds:
        include: []
        exclude: []
      kinds: [] # task, goal, challenge
      include: [] # Advancement IDs; * and ? are wildcards
      exclude: []
    vehicle-enter:
      worlds:
        include: []
        exclude: []
      vehicles: [] # boat, minecart, horse, camel, pig, strider, happy-ghast
      types: [] # Extra entity IDs, e.g. ['*_boat']
      exclude-types: []
      seats: [] # driver, passenger
    vehicle-exit:
      worlds:
        include: []
        exclude: []
      vehicles: []
      types: []
      exclude-types: []
      seats: []
  cooldown-ticks: 0 # Per player and effect; 0 disables the cooldown.
