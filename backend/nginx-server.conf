server {
    listen 80;
    server_name studio-relay.despical.dev;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name studio-relay.despical.dev;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/studio-relay.despical.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio-relay.despical.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /frameui-relay/ {
        client_max_body_size 33m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $relay_backend frameui-relay:8094;
        proxy_pass http://$relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Relay-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location / { return 404; }
}
