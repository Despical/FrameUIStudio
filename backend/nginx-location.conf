# Include inside the existing hub.despical.dev HTTPS server block.
location ^~ /frameui-relay/ {
    # Channel identifiers and private connection traffic must not enter access logs.
    access_log off;
    client_max_body_size 33m;
    proxy_pass http://frameui-relay:8094;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Relay-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
