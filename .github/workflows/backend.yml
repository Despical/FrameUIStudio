name: Backend container
on:
  push:
    branches: [main]
    paths: ['backend/**', 'test/relay.test.cjs', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'test/relay.test.cjs', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t frameui-relay backend
      - run: |
          docker run -d --name relay --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8094:8094 frameui-relay
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8094/frameui-relay/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs relay
          exit 1
      - if: always()
        run: docker rm -f relay || true
